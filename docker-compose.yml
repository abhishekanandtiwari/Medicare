version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medicare_postgres
    restart: always
    environment:
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_secure_password
      POSTGRES_DB: medicare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://medicare_user:medicare_secure_password@db:5432/medicare_db
      SECRET_KEY: medicare-production-super-secret-key-3849182379182
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
